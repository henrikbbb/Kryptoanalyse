<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Caesar-Chiffre Analyse</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; display: flex; justify-content: center; }
    .container { max-width: 1100px; width: 100%; }
    textarea {
      width: 100%;
      height: 180px;
      resize: none; /* feste Größe */
    }
    textarea[readonly] { background: #f5f5f5; cursor: not-allowed; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    .row { margin-bottom: 20px; }
    .text-row {
      display: flex;
      gap: 20px;
    }
    .text-row > div {
      flex: 1;
    }
    .key-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .key-controls button {
      font-size: 18px;
      width: 40px;
      height: 40px;
      cursor: pointer;
    }
    .analysis-row {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    canvas {
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<div class="container">

<h1>Caesar-Chiffre – Analyse & Entschlüsselung</h1>

<div class="row text-row">
  <div>
    <label>Verschlüsselter Text</label>
    <textarea id="ciphertext"></textarea>
  </div>
  <div>
    <label>Entschlüsselter Text</label>
    <textarea id="plaintext" readonly></textarea>
  </div>
</div>

<div class="row">
  <label>Schlüssel</label>
  <div class="key-controls">
    <button id="keyDown">&lt;</button>
    <span id="keyValue">0</span>
    <button id="keyUp">&gt;</button>
  </div>
</div>



<div class="row analysis-row">
  <div>
    <label>Häufigkeitsanalyse</label>
    <canvas id="freqChart" width="500" height="300"></canvas>
  </div>
  <div>
    <label>Cäsarscheibe</label>
    <canvas id="wheelCanvas" width="300" height="300"></canvas>
  </div>
</div>

<script>
const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let key = 0;

const cipherInput = document.getElementById('ciphertext');
const plainOutput = document.getElementById('plaintext');
const keyValue = document.getElementById('keyValue');

const freqCanvas = document.getElementById('freqChart');
const freqCtx = freqCanvas.getContext('2d');

const wheelCanvas = document.getElementById('wheelCanvas');
const wheelCtx = wheelCanvas.getContext('2d');

function decrypt(text, key) {
  return text.split('').map(ch => {
    const idx = alphabet.indexOf(ch.toUpperCase());
    if (idx === -1) return ch;
    const p = (idx - key + 26) % 26;
    return alphabet[p]; // immer Großbuchstaben im Klartext
  }).join('');
}

function drawFrequency(text) {
  const counts = Array(26).fill(0);
  text.toUpperCase().replace(/[^A-Z]/g, '').split('').forEach(ch => {
    counts[ch.charCodeAt(0) - 65]++;
  });

  freqCtx.clearRect(0, 0, freqCanvas.width, freqCanvas.height);
  const max = Math.max(...counts, 1);
  const barWidth = freqCanvas.width / 26;

  counts.forEach((count, i) => {
    const barHeight = (count / max) * (freqCanvas.height - 20);
    freqCtx.fillStyle = '#4a90e2';
    freqCtx.fillRect(i * barWidth, freqCanvas.height - barHeight, barWidth - 2, barHeight);
    freqCtx.fillStyle = '#000';
    freqCtx.fillText(alphabet[i], i * barWidth + 5, freqCanvas.height - 5);
  });
}

function drawWheel(key) {
  const cx = wheelCanvas.width / 2;
  const cy = wheelCanvas.height / 2;
  const rOuter = 130;
  const rInner = 90;

  wheelCtx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);

  wheelCtx.strokeStyle = '#000';
  wheelCtx.beginPath();
  wheelCtx.arc(cx, cy, rOuter, 0, Math.PI * 2);
  wheelCtx.arc(cx, cy, rInner, 0, Math.PI * 2);
  wheelCtx.stroke();

  for (let i = 0; i < 26; i++) {
    const angle = (i / 26) * Math.PI * 2 - Math.PI / 2;

    // outer (plaintext)
    wheelCtx.font = '14px Arial';
    wheelCtx.fillText(
      alphabet[i],
      cx + Math.cos(angle) * rOuter * 0.9 - 5,
      cy + Math.sin(angle) * rOuter * 0.9 + 5
    );

    // inner (ciphertext)
    const ci = (i + key) % 26;
    wheelCtx.font = '12px Arial';
    wheelCtx.fillText(
      alphabet[ci].toLowerCase(),
      cx + Math.cos(angle) * rInner * 0.9 - 4,
      cy + Math.sin(angle) * rInner * 0.9 + 4
    );
  }
}

function normalizeCipherInput(text) {
  return text
    .replace(/ß/g, 'ss')
    .toLowerCase();
}

function update() {
  // Eingabetext normalisieren
  const normalized = normalizeCipherInput(cipherInput.value);
  if (cipherInput.value !== normalized) {
    const pos = cipherInput.selectionStart;
    cipherInput.value = normalized;
    cipherInput.selectionStart = cipherInput.selectionEnd = pos;
  }

  keyValue.textContent = key;
  const cipher = cipherInput.value;
  plainOutput.value = decrypt(cipher, key);
  drawFrequency(cipher);
  drawWheel(key);
}

// key buttons

document.getElementById('keyUp').onclick = () => {
  key = (key + 1) % 26;
  update();
};

document.getElementById('keyDown').onclick = () => {
  key = (key + 25) % 26; // -1 modulo 26
  update();
};

cipherInput.addEventListener('input', update);

update();
</script>

</div>

</body>
</html>
